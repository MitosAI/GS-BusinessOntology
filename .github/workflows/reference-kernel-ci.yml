name: Reference Business Reality Kernel CI

on:
  push:
    branches:
      - build/reference-business-reality-kernel-v0.1
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'contracts/**'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test semantic kernel
        run: pytest -q
