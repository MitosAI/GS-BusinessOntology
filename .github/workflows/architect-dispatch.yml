name: Chief Architect Dispatch

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Architecture Decision Request issue number"
        required: true
        type: string

permissions:
  contents: read
  issues: write

env:
  CA_WORKSPACE_AGENT_ID: agtch_6a9cc7f918a08191820b3899a2486a70

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.labels.*.name, 'needs-architect') ||
        contains(github.event.issue.labels.*.name, 'ask-architect')))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve issue number
        id: issue
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger CA-001 Workspace Agent
        env:
          CHATGPT_AGENT_ACCESS_TOKEN: ${{ secrets.CHATGPT_AGENT_ACCESS_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if [ -z "$CHATGPT_AGENT_ACCESS_TOKEN" ]; then
            echo "Missing required repository Actions secret: CHATGPT_AGENT_ACCESS_TOKEN"
            exit 1
          fi

          INPUT="You are CA-001. Process the Architecture Decision Request in GitHub Issue #${ISSUE_NUMBER} in ${REPOSITORY}. Read the issue and the current governing repository artifacts using your connected GitHub tools. Apply the CA-001 decision protocol. If a GitHub write-capable action is available to you, post the final disposition back to the issue and update its status labels. If no write-capable action is available, complete the decision but do not claim that write-back occurred."
          BODY=$(jq -n --arg input "$INPUT" '{input:$input}')

          HTTP_CODE=$(curl -sS -o /tmp/ca_response.txt -w '%{http_code}' \
            -X POST \
            "https://api.chatgpt.com/v1/workspace_agents/${CA_WORKSPACE_AGENT_ID}/trigger" \
            -H "Authorization: Bearer ${CHATGPT_AGENT_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          if [ "$HTTP_CODE" != "202" ]; then
            echo "CA-001 trigger failed with HTTP ${HTTP_CODE}"
            cat /tmp/ca_response.txt
            exit 1
          fi

          echo "CA-001 dispatch accepted (HTTP 202)."

      - name: Mark request dispatched
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        shell: bash
        run: |
          gh label create "architect-dispatched" --repo "$GH_REPO" --color "1d76db" --description "CA-001 Workspace Agent trigger accepted" --force
          gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" --add-label "architect-dispatched"
