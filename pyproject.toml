[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gensigma-business-reality-kernel"
version = "0.1.0"
description = "Technology-neutral reference runtime for GenSigma Business Reality semantic contracts"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.26",
  "referencing>=0.37",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
